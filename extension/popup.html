<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TruthShield</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; width: 360px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b0f14; color: #e6edf3;
    }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #1f2a33; }
    header h1 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .dot.ok { background: #10b981; }
    .dot.bad { background: #ef4444; }
    main { padding: 12px 14px; }
    textarea {
      width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical;
      background: #0f151c; color: #e6edf3; border: 1px solid #1f2a33; border-radius: 8px; padding: 8px;
      font: inherit;
    }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1; cursor: pointer; font: inherit; font-weight: 600; padding: 7px 10px; border-radius: 8px;
      border: 1px solid rgba(16,185,129,.3); background: rgba(16,185,129,.12); color: #34d399;
    }
    button.secondary { border-color: #1f2a33; background: #0f151c; color: #c9d4de; }
    button:disabled { opacity: .55; cursor: default; }
    .result { margin-top: 12px; }
    .score { font-size: 26px; font-weight: 700; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .low { background: rgba(16,185,129,.15); color: #34d399 }
    .medium { background: rgba(234,179,8,.15); color: #facc15 }
    .high { background: rgba(249,115,22,.15); color: #fb923c }
    .critical { background: rgba(239,68,68,.15); color: #f87171 }
    .muted { color: #8b98a5; font-size: 11px }
    .expl { margin-top: 8px; font-size: 12px; color: #c9d4de }
    .hoax { margin-top: 10px; padding: 8px; border: 1px solid rgba(245,158,11,.35); background: rgba(245,158,11,.08); border-radius: 8px }
    .hoax b { color: #fbbf24 }
    .err { color: #f87171 }
    footer { padding: 10px 14px; border-top: 1px solid #1f2a33; display: flex; justify-content: space-between; align-items: center }
    a { color: #34d399; font-size: 11px; text-decoration: none }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="status-dot"></span>
    <h1>TruthShield</h1>
    <span class="muted" id="status-text">checking console…</span>
  </header>

  <main>
    <textarea id="input" placeholder="Paste a message, headline or claim. Or select text on any page, right-click, and choose Verify with TruthShield."></textarea>
    <div class="actions">
      <button id="analyze">Analyze patterns</button>
      <button id="factcheck" class="secondary">Fact-check claim</button>
    </div>
    <div class="result" id="result"></div>
  </main>

  <footer>
    <a href="#" id="open-console">Open console</a>
    <a href="#" id="open-options">Settings</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
